<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">Eco-Sentry — Neuromorphic anti-poaching acoustic detection</title>
  <desc id="desc">Pipeline diagram showing audio processing through spiking neural networks to encrypted LoRa delivery</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161B22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2EA043;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3FB950;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F0883E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7C948;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262D" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>

  <g id="title-block" transform="translate(64 56)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="14" font-weight="500" fill="#8B949E" letter-spacing="2">NEUROMORPHIC ACOUSTIC DETECTION</text>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="52" font-weight="700" fill="#F0F6FC">Eco-Sentry</text>
    <text x="0" y="92" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20" fill="#8B949E">Anti-poaching detection for Indian forest reserves —</text>
    <text x="0" y="120" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="20" fill="#8B949E">spiking neural networks on solar-powered edge devices</text>
  </g>

  <g id="pipeline-diagram" transform="translate(64 200)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" fill="#6E7681" letter-spacing="1">PIPELINE</text>

    <g id="stage-1" transform="translate(0 20)">
      <rect x="0" y="0" width="120" height="56" rx="8" fill="#21262D" stroke="#30363D" stroke-width="1"/>
      <text x="60" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="13" font-weight="600" fill="#F0F6FC">Audio</text>
      <text x="60" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="10" fill="#8B949E">ARCH_1-2</text>
    </g>

    <path d="M 124 48 L 148 48" stroke="#3FB950" stroke-width="1.5" fill="none"/>
    <polygon points="148,44 156,48 148,52" fill="#3FB950"/>

    <g id="stage-2" transform="translate(160 20)">
      <rect x="0" y="0" width="120" height="56" rx="8" fill="#21262D" stroke="#30363D" stroke-width="1"/>
      <text x="60" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="13" font-weight="600" fill="#F0F6FC">Spikes</text>
      <text x="60" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="10" fill="#8B949E">ARCH_3-4</text>
    </g>

    <path d="M 284 48 L 308 48" stroke="#3FB950" stroke-width="1.5" fill="none"/>
    <polygon points="308,44 316,48 308,52" fill="#3FB950"/>

    <g id="stage-3" transform="translate(320 20)">
      <rect x="0" y="0" width="120" height="56" rx="8" fill="#21262D" stroke="#30363D" stroke-width="1"/>
      <text x="60" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="13" font-weight="600" fill="#F0F6FC">SNN</text>
      <text x="60" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="10" fill="#8B949E">ARCH_5</text>
    </g>

    <path d="M 444 48 L 468 48" stroke="#3FB950" stroke-width="1.5" fill="none"/>
    <polygon points="468,44 476,48 468,52" fill="#3FB950"/>

    <g id="stage-4" transform="translate(480 20)">
      <rect x="0" y="0" width="120" height="56" rx="8" fill="#21262D" stroke="#30363D" stroke-width="1"/>
      <text x="60" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="13" font-weight="600" fill="#F0F6FC">Encrypt</text>
      <text x="60" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="10" fill="#8B949E">ARCH_6</text>
    </g>

    <path d="M 604 48 L 628 48" stroke="#3FB950" stroke-width="1.5" fill="none"/>
    <polygon points="628,44 636,48 628,52" fill="#3FB950"/>

    <g id="stage-5" transform="translate(640 20)">
      <rect x="0" y="0" width="120" height="56" rx="8" fill="url(#pulse)" stroke="#F0883E" stroke-width="1"/>
      <text x="60" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="13" font-weight="600" fill="#FFFFFF">LoRa</text>
      <text x="60" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="10" fill="#FFFFFF">ARCH_8</text>
    </g>

    <path d="M 764 48 L 788 48" stroke="#F0883E" stroke-width="1.5" fill="none"/>
    <polygon points="788,44 796,48 788,52" fill="#F0883E"/>

    <g id="stage-6" transform="translate(800 20)">
      <rect x="0" y="0" width="120" height="56" rx="8" fill="#21262D" stroke="#30363D" stroke-width="1"/>
      <text x="60" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
            font-size="13" font-weight="600" fill="#F0F6FC">Alert</text>
      <text x="60" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="10" fill="#8B949E">116 B</text>
    </g>
  </g>

  <g id="metrics" transform="translate(64 300)">
    <g transform="translate(0 0)">
      <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#6E7681">ACCURACY</text>
      <text x="0" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="24" font-weight="700" fill="#3FB950">96.3%</text>
    </g>
    <g transform="translate(140 0)">
      <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#6E7681">FALSE ALERTS</text>
      <text x="0" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="24" font-weight="700" fill="#3FB950">0.0%</text>
    </g>
    <g transform="translate(310 0)">
      <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#6E7681">PAYLOAD</text>
      <text x="0" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="24" font-weight="700" fill="#3FB950">116 B</text>
    </g>
    <g transform="translate(460 0)">
      <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#6E7681">LATENCY p95</text>
      <text x="0" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="24" font-weight="700" fill="#3FB950">630 ms</text>
    </g>
    <g transform="translate(640 0)">
      <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#6E7681">DELIVERY</text>
      <text x="0" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="24" font-weight="700" fill="#3FB950">100%</text>
    </g>
    <g transform="translate(790 0)">
      <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#6E7681">ENDURANCE</text>
      <text x="0" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="24" font-weight="700" fill="#3FB950">30 days</text>
    </g>
  </g>

  <g id="metadata" transform="translate(1060 56)">
    <text x="0" y="0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" fill="#6E7681">Python 3.10+</text>
    <text x="0" y="20" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" fill="#6E7681">NumPy / SciPy</text>
    <text x="0" y="40" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" fill="#6E7681">AES-256</text>
    <text x="0" y="60" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" fill="#6E7681">LoRa Mesh</text>
  </g>
</svg>
